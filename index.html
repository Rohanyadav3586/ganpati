<style>
:root{--bg:#f3f6fb;--card:#fff;--tx:#0f1b33;--mu:#5b6b85;--navy:#0b2a5b;--g:#1a9d4b;--r:#d92d2d;--o:#e8890c;--b:#2f7bf0;--bd:#dbe3ef;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root{color-scheme:light}th{background:#f1f5fb;color:#0b2a5b;font-size:12px;text-transform:uppercase;letter-spacing:.3px}.av{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#dbe3ef;border:2px solid #fff;box-shadow:0 1px 4px #0b2a5b33}button:hover{filter:brightness(1.1)}tr[onclick]:hover{background:#f1f5fb}

header{background:linear-gradient(135deg,#0b2a5b,#1457a8);color:#fff;box-shadow:0 2px 10px #0b2a5b40;padding:12px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

<script>
const CO={n:"Shree Ganpati Finance",f:"Arvind Yadav",p:"9470036418",t:"Small Support, Bigger Growth."};
let DB,S=null,view="home",arg=null,lang="en";
const T={en:{home:"Home",dash:"Dashboard",cust:"Customers",newc:"New Customer",coll:"Today’s Collection",over:"Client Dues",agents:"Agents",audit:"Audit Log",out:"Logout"},hi:{home:"होम",dash:"डैशबोर्ड",cust:"ग्राहक",newc:"नया ग्राहक",coll:"आज का कलेक्शन",over:"बकाया",agents:"एजेंट",audit:"ऑडिट लॉग",out:"लॉगआउट"}};
const t=k=>T[lang][k];
const $=s=>document.querySelector(s),R=n=>"₹"+Number(n||0).toLocaleString("en-IN",{maximumFractionDigits:2});
const iso=d=>d.toISOString().slice(0,10),today=()=>iso(new Date());
const dm=s=>s?s.split("-").reverse().join("-"):"";
const addD=(s,n)=>{const d=new Date(s+"T00:00:00Z");d.setUTCDate(d.getUTCDate()+n);return iso(d)};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function log(a){DB.audit.unshift({at:new Date().toLocaleString("en-IN"),u:S?.id||"-",a});save()}
/* ---- finance core ---- */
function calc(P,rate,fee,days){const interest=Math.round(P*rate/100*100)/100,total=P+interest+fee;
 const emi=Math.floor(total/days*100)/100,last=Math.round((total-emi*(days-1))*100)/100;return{interest,total,emi,last}}
function sched(l){const a=[];for(let i=1;i<=l.days;i++)a.push({n:i,due:addD(l.start,i-1),amt:i==l.days?l.last:l.emi,paid:0,last:null});
 let pool=0;const ps=DB.pay.filter(p=>p.loan==l.id&&!p.rev).sort((x,y)=>x.id-y.id);ps.forEach(p=>pool+=p.amt);
 let cum=0,td=today();
 a.forEach(s=>{const take=Math.min(pool,s.amt);s.paid=Math.round(take*100)/100;pool-=take;
  s.st=s.paid>=s.amt-.005?(s.due>td?"B":"G"):s.due<td?(s.paid>0?"O":"R"):s.paid>0?"O":"N";
  if((l.miss||[]).includes(s.due)&&s.paid<s.amt-.005)s.st="R";cum+=s.amt;let pc=0;ps.forEach(p=>{if(p.date<=s.due)pc+=p.amt});s.ontime=pc>=cum-.005});
 return a}
function stats(l){const s=sched(l),td=today(),paid=s.reduce((x,y)=>x+y.paid,0),due=s.filter(x=>x.due<=td),
 overdue=s.filter(x=>x.due<td).reduce((x,y)=>x+(y.amt-y.paid),0),missed=s.filter(x=>x.st=="R").length,
 ontime=due.filter(x=>x.ontime).length,score=due.length?Math.round(ontime/due.length*100):100,rem=l.total-paid,
 done=rem<=.005,rating=score>=90?"Excellent":score>=75?"Good":score>=60?"Average":score>=40?"Poor":"High Risk";
 return{s,paid,rem:Math.max(rem,0),overdue,missed,score,rating,done,delayed:due.length-ontime,prog:Math.min(100,Math.round(paid/l.total*100))}}
const can=l=>S.role=="admin"||l.agent==S.id;
const loans=()=>DB.loans.filter(l=>l.status=="active"&&can(l));
/* ---- storage & auth (AES-256-GCM, key wrapped per user password) ---- */
const enc=new TextEncoder(),dec=new TextDecoder();let META=null,DK=null,RAW=null,Q=Promise.resolve();
const DEF=()=>({users:[],cust:[],loans:[],pay:[],audit:[],seq:{c:0,l:0,p:0},cfg:{days:120,penalty:0},home:""});
function load(){try{META=JSON.parse(localStorage.getItem("sgf3")||"null")}catch(e){META=null}DB=DEF()}
async function kdf(p,salt){const k=await crypto.subtle.importKey("raw",enc.encode(p),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:250000,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function aes(k,s){const iv=crypto.getRandomValues(new Uint8Array(12));return b64(iv)+"."+b64(await crypto.subtle.encrypt({name:"AES-GCM",iv},k,enc.encode(s)))}
async function dea(k,s){const[i,c]=s.split(".");return dec.decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:unb(i)},k,unb(c)))}
const imk=r=>crypto.subtle.importKey("raw",r,"AES-GCM",false,["encrypt","decrypt"]);
function save(){const k=DK,d=DB;Q=Q.then(async()=>{if(!k)return;const{users,...rest}=d;META={users,data:await aes(k,JSON.stringify(rest))};try{localStorage.setItem("sgf3",JSON.stringify(META))}catch(e){}}).catch(()=>{})}
const idb=()=>new Promise((r,j)=>{const q=indexedDB.open("sgf",1);q.onupgradeneeded=()=>q.result.createObjectStore("k");q.onsuccess=()=>r(q.result);q.onerror=j});
const kput=async v=>{const d=await idb();return new Promise(r=>{const t=d.transaction("k","readwrite");t.objectStore("k").put(v,"bk");t.oncomplete=r})};
const kget=async()=>{const d=await idb();return new Promise(r=>{const q=d.transaction("k").objectStore("k").get("bk");q.onsuccess=()=>r(q.result)})};
const GANESH=`<svg viewBox="0 0 300 190" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b2a5b"/><stop offset="1" stop-color="#8a3a08"/></linearGradient><radialGradient id="gg"><stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#d98a12"/></radialGradient></defs><rect width="300" height="190" fill="url(#gb)"/><g fill="none" stroke="#ffd36b" stroke-opacity=".3"><circle cx="150" cy="95" r="88"/><circle cx="150" cy="95" r="74" stroke-dasharray="3 5"/><circle cx="150" cy="95" r="60"/></g><ellipse cx="104" cy="92" rx="26" ry="34" fill="#e89a2c"/><ellipse cx="196" cy="92" rx="26" ry="34" fill="#e89a2c"/><path d="M118 50L150 18L182 50Z" fill="url(#gg)" stroke="#b8650a"/><ellipse cx="150" cy="90" rx="36" ry="40" fill="url(#gg)"/><path d="M128 55Q150 45 172 55" stroke="#c0392b" stroke-width="4" fill="none"/><circle cx="150" cy="64" r="3" fill="#c0392b"/><circle cx="137" cy="82" r="3.5" fill="#222"/><circle cx="163" cy="82" r="3.5" fill="#222"/><path d="M150 88Q146 130 166 140Q178 144 174 132" stroke="#c9780f" stroke-width="13" fill="none" stroke-linecap="round"/><path d="M132 112Q124 128 134 136" stroke="#fff6dc" stroke-width="5" fill="none" stroke-linecap="round"/><text x="150" y="178" text-anchor="middle" font-size="15" fill="#ffd36b" font-family="serif">॥ श्री गणेशाय नमः ॥</text></svg>`;
function loginView(){const first=!META,bio=localStorage.getItem("sgfbio");
 $("#app").innerHTML=`<div class="hh" style="border-radius:0">${GANESH}</div><main><div class="card" style="max-width:380px;margin:-30px auto 20px;position:relative"><div style="text-align:center"><b style="color:var(--navy);font-size:18px">SHREE GANPATI FINANCE</b><br><span class="hi">भरोसा हमारा, तरक्की आपकी</span><br><span class="mu">Since 2010 · ${CO.t}<br>Founder & CEO: ${CO.f} · ${CO.p}</span></div><br><h3>${first?"Initial Setup: create Owner account":"Login"}</h3><label>User ID</label><input id="u" autocomplete="username"><label>Password ${first?"(min 8)":""}</label><input id="p" type="password" autocomplete="current-password"><label><input type="checkbox" onchange="$('#p').type=this.checked?'text':'password'" style="width:auto"> Show password</label><br><br><button style="width:100%" onclick="${first?"setup()":"login()"}">${first?"Create & Login":"Login"}</button>${!first&&bio?'<button class="s" style="width:100%;margin-top:8px" onclick="bioLogin()">☝ Login with Fingerprint</button>':""}<p id="er" style="color:var(--r)"></p><p class="mu">All data is AES-256 encrypted on this device. A forgotten password cannot be recovered, so keep backups.</p></div></main>`}
async function setup(){const u=$("#u").value.trim(),p=$("#p").value;if(!u||p.length<8)return $("#er").textContent="Enter ID and 8+ char password";
 const salt=crypto.getRandomValues(new Uint8Array(16));RAW=crypto.getRandomValues(new Uint8Array(32));DK=await imk(RAW);const pk=await kdf(p,salt);
 DB=DEF();DB.users=[{id:u,name:u,role:"admin",on:true,salt:b64(salt),wk:await aes(pk,b64(RAW))}];S=DB.users[0];try{localStorage.removeItem("sgf")}catch(e){}log("Owner account created");go("home")}
async function login(){const id=$("#u").value.trim(),k="lk";let f=+(sessionStorage.getItem(k)||0);if(f>=5)return $("#er").textContent="Too many attempts. Reload after some time.";
 const m=META&&META.users.find(x=>x.id==id);
 try{if(!m||!m.on)throw 0;const pk=await kdf($("#p").value,unb(m.salt));RAW=unb(await dea(pk,m.wk));DK=await imk(RAW);const d=JSON.parse(await dea(DK,META.data));DB={...DEF(),...d,users:META.users};S=DB.users.find(x=>x.id==id);log("Login");go("home")}
 catch(e){DK=RAW=null;sessionStorage.setItem(k,f+1);$("#er").textContent="Invalid credentials"}}
function logout(){log("Logout");S=null;DK=null;RAW=null;DB=DEF();loginView()}
document.addEventListener("visibilitychange",()=>{if(document.hidden)window._h=Date.now();else if(S&&Date.now()-(window._h||0)>120000)logout()});
async function bioEnable(){if(!RAW)return alert("Login with password first, then enable fingerprint");try{const c=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:"Shree Ganpati Finance"},user:{id:enc.encode(S.id),name:S.id,displayName:S.id},pubKeyCredParams:[{type:"public-key",alg:-7},{type:"public-key",alg:-257}],authenticatorSelection:{authenticatorAttachment:"platform",userVerification:"required"},timeout:60000}});
 await kput(await imk(RAW));localStorage.setItem("sgfbio",JSON.stringify({c:b64(c.rawId),u:S.id}));log("Fingerprint enabled");alert("Fingerprint enabled on this device");render()}catch(e){alert("Fingerprint not available ("+e.name+"). Open the installed app on a phone with fingerprint set up.")}}
async function bioLogin(){try{const o=JSON.parse(localStorage.getItem("sgfbio"));await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:"public-key",id:unb(o.c)}],userVerification:"required",timeout:60000}});
 DK=await kget();const d=JSON.parse(await dea(DK,META.data));DB={...DEF(),...d,users:META.users};S=DB.users.find(x=>x.id==o.u&&x.on);if(!S)throw 0;log("Fingerprint login");go("home")}catch(e){DK=null;$("#er").textContent="Fingerprint failed. Use password."}}
function home(){return`<div class="hh">${DB.home?`<img src="${DB.home}">`:GANESH}</div>${S.role=="admin"?`<label class="mu">Change Bappa image (optional)</label><input type="file" accept="image/*" onchange="setHome(this.files[0])">`:""}
<div class="card" style="text-align:center"><h2 style="margin:0;color:var(--navy)">SHREE GANPATI FINANCE</h2><div class="hi">भरोसा हमारा, तरक्की आपकी</div><span class="mu">Since 2010 · ${CO.t}</span></div>
<div class="card"><h3>About Us</h3><p>Serving families since 2010, Shree Ganpati Finance provides small, low-interest financial assistance to households, small shopkeepers, women and financially vulnerable families, with a simple daily repayment, so they can grow their business and meet essential needs.</p><p class="mu">Founder & CEO: ${CO.f} · Contact: ${CO.p}</p></div>
<div class="grid"><button onclick="go('dash')">📊 Dashboard</button><button onclick="go('cust')">👥 Customers</button><button onclick="go('newc')">➕ New Client</button><button onclick="go('coll')">✅ Today’s Collection</button></div>${S.role=="admin"?`<div class="card" style="margin-top:14px"><h3>Backup</h3><p class="mu">The backup file is encrypted. It opens only with the owner password used when it was made. Keep copies safe (WhatsApp to self / Drive).</p><button style="width:100%" onclick="exportBk()">⬇ Export encrypted backup</button><label style="display:block;margin-top:10px">Import backup (replaces all data on this phone)</label><input type="file" accept=".json" onchange="importBk(this.files[0])"></div>`:""}`}
async function exportBk(){await Q;const d=localStorage.getItem("sgf3");if(!d)return alert("Nothing to back up yet");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([d],{type:"application/json"}));a.download="ganpati-backup-"+today()+".json";a.click();log("Backup exported")}
async function importBk(f){if(!f||!confirm("Replace ALL data on this phone with this backup? You will need that backup’s password to login."))return;try{const o=JSON.parse(await f.text());if(!Array.isArray(o.users)||!o.data)throw 0;localStorage.setItem("sgf3",JSON.stringify(o));localStorage.removeItem("sgfbio");META=o;S=null;DK=null;RAW=null;DB=DEF();alert("Backup restored. Please login.");loginView()}catch(e){alert("Invalid backup file")}}
async function setHome(f){if(!f)return;DB.home=await img(f,700);log("Home image changed");render()}
async function miss(id){const l=DB.loans.find(x=>x.id==id);if(!can(l))return;l.miss=l.miss||[];if(!l.miss.includes(today()))l.miss.push(today());log("Not paid today: "+id);render()}
/* ---- shell ---- */
function go(v,a){view=v;arg=a;render()}
function render(){const nav=[["home","home"],["dash","dash"],["cust","cust"]];if(S.role=="admin")nav.push(["newc","newc"]);nav.push(["coll","coll"],["over","over"]);if(S.role=="admin")nav.push(["agents","agents"],["audit","audit"]);
 const V={home,dash,cust,newc,coll,over,agents,audit,file,loan:loanForm}[view]();
 $("#app").innerHTML=`<header><b>SHREE GANPATI FINANCE<small>${CO.t} · ${CO.f} · ${CO.p}</small></b><button class="s" style="color:#fff;border-color:#fff6" onclick="lang=lang=='en'?'hi':'en';render()">${lang=="en"?"हिं":"EN"}</button><button class="s" style="color:#fff;border-color:#fff6" onclick="bioEnable()">${localStorage.getItem("sgfbio")?"✔ Fingerprint":"Enable Fingerprint"}</button><button class="s" style="color:#fff;border-color:#fff6" onclick="logout()">${t("out")} (${esc(S.id)})</button></header>
 <nav class="np">${nav.map(n=>`<button class="${view==n[0]?"on":"s"}" onclick="go('${n[0]}')">${t(n[1])}</button>`).join("")}</nav><main>${V}</main>`}
const pill=s=>`<span class="pill ${s}">${{G:"✔ Paid",R:"✘ Missed",O:"Partial/Overdue",B:"Advance",N:"Upcoming"}[s]}</span>`;
function dash(){const L=DB.loans.filter(can),A=L.filter(l=>l.status=="active"),st=L.filter(l=>l.status!="pending").map(l=>({l,s:stats(l)})),td=today();
 const pays=DB.pay.filter(p=>!p.rev&&can(DB.loans.find(l=>l.id==p.loan))),tp=pays.filter(p=>p.date==td).reduce((x,y)=>x+y.amt,0);
 const exp=A.reduce((x,l)=>{const s=sched(l).find(z=>z.due==td);return x+(s?s.amt-Math.min(s.paid,s.amt):0)},0);
 const c=[["Total Customers",DB.cust.filter(x=>S.role=="admin"||DB.loans.some(l=>l.cust==x.id&&can(l))).length],["Active Loans",A.length],["Total Investment (Loan Given)",R(L.filter(l=>l.status!="pending").reduce((x,l)=>x+l.principal,0))],["Expected Collection",R(L.filter(l=>l.status!="pending").reduce((x,l)=>x+l.total,0))],["Collected",R(pays.reduce((x,y)=>x+y.amt,0))],["Today’s Collection",R(tp)],["Today’s Pending",R(exp)],["Overdue Amount",R(st.reduce((x,y)=>x+y.s.overdue,0))],["Completed Loans",st.filter(x=>x.s.done).length],["Overdue Loans",st.filter(x=>x.s.overdue>0&&!x.s.done).length]];
 const byA={};pays.forEach(p=>byA[p.by]=(byA[p.by]||0)+p.amt);
 return`<h2>${t("dash")}</h2><div class="grid">${c.map(x=>`<div class="st"><span>${x[0]}</span><b>${x[1]}</b></div>`).join("")}</div><div class="card" style="margin-top:12px"><h3>Last 7 days collection</h3>${chart(pays)}</div>
 <div class="card"><h3>Recent transactions</h3><div class="tw"><table>${pays.slice(-5).reverse().map(p=>`<tr><td>${p.rc}</td><td>${dm(p.date)}</td><td>${R(p.amt)}</td><td>${p.mode}</td><td>${p.by}</td></tr>`).join("")||"<tr><td>No payments yet</td></tr>"}</table></div></div>
 <div class="card"><h3>Agent-wise collection</h3>${Object.entries(byA).map(([k,v])=>`${esc(k)}: <b>${R(v)}</b><br>`).join("")||"<span class=mu>No data</span>"}</div>`}
function chart(pays){const d=[];for(let i=6;i>=0;i--){const x=addD(today(),-i);d.push([x,pays.filter(p=>p.date==x).reduce((a,b)=>a+b.amt,0)])}
 const m=Math.max(1,...d.map(x=>x[1]));return`<svg viewBox="0 0 280 110" width="100%">${d.map((x,i)=>{const h=x[1]/m*70;return`<rect x="${i*40+8}" y="${80-h}" width="26" height="${h}" rx="3" fill="var(--navy)"/><text x="${i*40+21}" y="95" font-size="9" text-anchor="middle" fill="var(--mu)">${x[0].slice(8)+"/"+x[0].slice(5,7)}</text><text x="${i*40+21}" y="${76-h}" font-size="8" text-anchor="middle" fill="var(--tx)">${x[1]||""}</text>`}).join("")}</svg>`}
function cust(){const q=(window.q||"").toLowerCase(),f=window.fl||"all";
 let rows=DB.cust.map(c=>{const l=DB.loans.find(x=>x.cust==c.id&&x.status!="closed");return{c,l,s:l&&l.status=="active"?stats(l):null}}).filter(r=>S.role=="admin"||(r.l&&can(r.l)));
 rows=rows.filter(r=>(r.c.name+r.c.id+r.c.mob).toLowerCase().includes(q)).filter(r=>f=="all"||(f=="active"&&r.l?.status=="active")||(f=="pending"&&r.l?.status=="pending")||(f=="done"&&r.s?.done)||(f=="over"&&r.s?.overdue>0)||(f=="exc"&&r.s?.rating=="Excellent")||(f=="poor"&&["Poor","High Risk"].includes(r.s?.rating)));
 return`<h2>${t("cust")}</h2><div class="row np"><input placeholder="Search name / ID / phone" value="${esc(window.q||"")}" oninput="window.q=this.value;render();$('input').focus()"><select onchange="window.fl=this.value;render()">${[["all","All"],["active","Active loans"],["done","Completed"],["pending","Pending"],["over","Overdue"],["exc","Excellent"],["poor","Poor performance"]].map(o=>`<option value="${o[0]}" ${f==o[0]?"selected":""}>${o[1]}</option>`).join("")}</select><button onclick="exportCSV()">Export CSV</button></div>
 <div class="card tw"><table><tr><th></th><th>ID</th><th>Name</th><th>Mobile</th><th>Loan</th><th>EMI</th><th>Start</th><th>Paid</th><th>Balance</th><th>Status</th><th>Rating</th><th>Agent</th></tr>${rows.map(r=>`<tr onclick="go('file','${r.c.id}')" style="cursor:pointer"><td><img class="av" src="${r.c.photo||ph0}" style="width:32px;height:32px"></td><td>${r.c.id}</td><td>${esc(r.c.name)}</td><td>${esc(r.c.mob)}</td><td>${r.l?R(r.l.principal):"-"}</td><td>${r.l?R(r.l.emi):"-"}</td><td>${r.l?dm(r.l.start):"-"}</td><td>${r.s?R(r.s.paid)+" ("+r.s.prog+"%)":"-"}</td><td>${r.s?R(r.s.rem):"-"}</td><td>${r.l?.status||"No loan"}</td><td>${r.s?.rating||"-"}</td><td>${r.l?.agent||"-"}</td></tr>`).join("")||"<tr><td>No customers</td></tr>"}</table></div>`}
function exportCSV(){const r=[["ID","Name","Mobile","Loan","EMI","Status"]];DB.cust.forEach(c=>{const l=DB.loans.find(x=>x.cust==c.id);r.push([c.id,c.name,c.mob,l?.principal||"",l?.emi||"",l?.status||""])});
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([r.map(x=>x.map(v=>`"${v}"`).join(",")).join("\n")],{type:"text/csv"}));a.download="customers.csv";a.click()}
function newc(){if(S.role!="admin")return"Not allowed";const F=(i,l,ty="text")=>`<div><label>${l}</label><input id="${i}" type="${ty}"></div>`;
 return`<h2>${t("newc")}</h2><div class="card"><div class="row">${F("n","Full Name *")}${F("fa","Father/Husband Name")}${F("dob","Date of Birth","date")}${F("mob","Mobile *","tel")}${F("alt","Alternate Mobile","tel")}${F("vil","Village")}${F("dist","District")}${F("pin","PIN Code")}${F("occ","Occupation")}${F("inc","Monthly Income","number")}${F("gn","Guarantor Name")}${F("gm","Guarantor Mobile","tel")}${F("gr","Guarantor Relation")}${F("bank","Bank Name")}${F("ifsc","IFSC")}${F("acc","Account Number")}${F("aad","Aadhaar Number (12 digits)")}${F("pr","Loan Amount ₹","number")}${F("tt","Total Repayment ₹","number")}${F("dy","Days (blank = 120)","number")}${F("ld","Loan Date (blank = today)","date")}<div><label>Agent</label><select id="ag"><option value="">— none —</option>${DB.users.filter(u=>u.role=="agent"&&u.on).map(a=>`<option>${a.id}</option>`).join("")}</select></div></div><label>Address</label><textarea id="adr"></textarea><label>Customer Photo (single)</label><input id="ph" type="file" accept="image/*"><label>Customer Signature (photo)</label><input id="sg" type="file" accept="image/*">
 <label><input type="checkbox" id="cons" style="width:auto"> Customer has given informed consent for data collection *</label><br><br><button onclick="addCust()">Register Customer</button><p class="mu">If a loan amount is entered, the loan is created as active on saving. Everything is encrypted on this device.</p></div>`}
async function addCust(){const v=i=>$("#"+i).value.trim();if(!v("n")||!/^\d{10}$/.test(v("mob")))return alert("Name and 10-digit mobile required");if(!$("#cons").checked)return alert("Consent required");
 if(v("aad")&&!/^\d{12}$/.test(v("aad")))return alert("Aadhaar must be 12 digits");
 const P=+v("pr"),TT=+v("tt"),dy=Math.round(+v("dy")||DB.cfg.days),ld=v("ld")||today();if(P&&(!(P>0)||TT<P))return alert("Total repayment must be at least the loan amount");
 const photo=$("#ph").files[0]?await img($("#ph").files[0],200):"",sig=$("#sg").files[0]?await img($("#sg").files[0],300):"";
 const id="SGF-C"+String(++DB.seq.c).padStart(4,"0");
 DB.cust.push({id,name:v("n"),fa:v("fa"),dob:v("dob"),mob:v("mob"),alt:v("alt"),vil:v("vil"),dist:v("dist"),pin:v("pin"),occ:v("occ"),inc:v("inc"),adr:v("adr"),gn:v("gn"),gm:v("gm"),gr:v("gr"),bank:v("bank"),ifsc:v("ifsc"),acc:v("acc"),aad:v("aad"),reg:today(),photo,sig,docs:[]});log("Customer "+id+" registered");
 if(P>0){const emi=Math.floor(TT/dy*100)/100,last=Math.round((TT-emi*(dy-1))*100)/100,lid="SGF-L"+String(++DB.seq.l).padStart(4,"0"),st=addD(ld,1);
  DB.loans.push({id:lid,cust:id,principal:P,rate:0,fee:0,days:dy,interest:TT-P,total:TT,emi,last,start:st,last_d:addD(st,dy-1),agent:v("ag"),status:"active",applied:ld,approved:ld});log("Loan "+lid+" active for "+id)}
 go("file",id)}
function file(){const c=DB.cust.find(x=>x.id==arg);if(!c)return"Not found";const ls=DB.loans.filter(l=>l.cust==c.id&&can(l));
 const acc=S.role=="admin"&&c.acc?"XXXXXX"+c.acc.slice(-4):"Hidden";
 return`<div class="card" style="display:flex;gap:14px;align-items:center"><img class="av" style="width:72px;height:72px" src="${c.photo||ph0}"><div><h2 style="margin:0">${esc(c.name)}</h2><span class="mu">${c.id}</span>${S.role=="admin"?`<br><input type="file" accept="image/*" onchange="setPhoto('${c.id}',this.files[0])" style="font-size:12px;width:200px">`:""}</div></div><div class="card"><div class="row"><div>Mobile: ${esc(c.mob)}<br>Alt: ${esc(c.alt)}<br>Father/Husband: ${esc(c.fa)}<br>DOB: ${dm(c.dob)}</div><div>${esc(c.adr)}<br>${esc(c.vil)}, ${esc(c.dist)} ${esc(c.pin)}<br>Occupation: ${esc(c.occ)}</div>
 ${S.role=="admin"?`<div>Bank: ${esc(c.bank)} ${esc(c.ifsc)}<br>A/C: ${acc}<br>Guarantor: ${esc(c.gn)} (${esc(c.gr)}) ${esc(c.gm)}<br>Aadhaar: ${c.aad?`<span onclick="this.textContent='${c.aad}'" style="cursor:pointer">XXXX-XXXX-${c.aad.slice(-4)} (tap)</span>`:"-"}${c.sig?`<br>Signature:<br><img src="${c.sig}" style="height:46px;background:#fff;border:1px solid var(--bd)">`:""}</div>`:""}</div>${S.role=="admin"?`<br><button onclick="go('loan','${c.id}')">+ New Loan</button>`:""}</div>${S.role=="admin"?`<div class="card"><h3>Documents</h3>${(c.docs||[]).map((o,i)=>`<div style="margin:4px 0">${esc(o.t)} · ${esc(o.n)} · ${dm(o.at)} <button class="s" onclick="viewDoc('${c.id}',${i})">View</button></div>`).join("")||"<span class=mu>No documents</span>"}<div class="row np" style="margin-top:8px"><select id="dt"><option>ID proof</option><option>Address proof</option><option>Bank passbook</option><option>Guarantor ID</option><option>Other</option></select><input id="df" type="file" accept="image/*,.pdf"><button onclick="addDoc('${c.id}')">Upload</button></div></div>`:""}
 ${ls.map(l=>{const s=stats(l);return`<div class="card"><h3>${l.id} <span class="pill ${s.done?"G":l.status=="pending"?"O":"B"}">${s.done?"completed":l.status}</span></h3>
 <div class="grid"><div class="st"><span>Principal</span><b>${R(l.principal)}</b></div><div class="st"><span>Interest</span><b>${R(l.interest)}</b></div><div class="st"><span>Total repay</span><b>${R(l.total)}</b></div><div class="st"><span>Daily EMI</span><b>${R(l.emi)}</b></div><div class="st"><span>Paid</span><b>${R(s.paid)}</b></div><div class="st"><span>Balance</span><b>${R(s.rem)}</b></div><div class="st"><span>Overdue</span><b>${R(s.overdue)}</b></div><div class="st"><span>Missed</span><b>${s.missed}</b></div><div class="st"><span>Internal score</span><b>${s.score} ${s.rating}</b></div></div>
 <p class="mu">Internal repayment score, not a CIBIL/bureau score. Progress ${s.prog}%. Loan date: ${dm(l.applied)} · Agent: ${l.agent||"-"} · EMI ${dm(l.start)} to ${dm(l.last_d)}</p>
 ${l.status=="pending"?(S.role=="admin"?`<button onclick="approve('${l.id}')">Approve loan</button> `:"")+"<p>Schedule preview below</p>":`<div class="row np"><input id="a${l.id}" type="number" placeholder="Amount ₹" value="${l.emi}"><select id="m${l.id}"><option>Cash</option><option>UPI</option><option>Bank Transfer</option><option>Other</option></select><button onclick="pay('${l.id}')">Record payment</button><button class="s" onclick="miss('${l.id}')">✘ Not paid today</button></div>`}
 <button class="s np" onclick="window.print()">Print / Save PDF</button>
 <h3>Collection sheet</h3><div class="tw"><table><tr><th>#</th><th>Due</th><th>EMI</th><th>Collected</th><th>Status</th></tr>${s.s.map(x=>`<tr><td>${x.n}</td><td>${dm(x.due)}</td><td>${R(x.amt)}</td><td>${R(x.paid)}</td><td>${pill(x.st)}</td></tr>`).join("")}</table></div>
 <h3>Transactions</h3><div class="tw"><table>${DB.pay.filter(p=>p.loan==l.id).map(p=>`<tr style="${p.rev?"text-decoration:line-through;opacity:.6":""}"><td>${p.rc}</td><td>${dm(p.date)}</td><td>${R(p.amt)}</td><td>${p.mode}</td><td>${p.by}</td><td>${p.rev?"reversed":`<button class="s np" onclick="receipt(${p.id})">Receipt</button>${S.role=="admin"?`<button class="s np" onclick="rev(${p.id})">Reverse</button>`:""}`}</td></tr>`).join("")||"<tr><td>None</td></tr>"}</table></div></div>`}).join("")||'<div class="card">No loan yet.</div>'}`}
function loanForm(){const ag=DB.users.filter(u=>u.role=="agent"&&u.on);
 return`<h2>New Loan for ${arg}</h2><div class="card"><div class="row"><div><label>Principal ₹</label><input id="P" type="number" value="12000" oninput="prev()"></div><div><label>Total interest rate % (flat on principal)</label><input id="I" type="number" value="25" oninput="prev()"></div><div><label>Disclosed fees ₹</label><input id="F" type="number" value="0" oninput="prev()"></div><div><label>Days</label><input id="D" type="number" value="${DB.cfg.days}" oninput="prev()"></div><div><label>First EMI date</label><input id="S" type="date" value="${addD(today(),1)}"></div><div><label>Agent</label><select id="A">${ag.map(a=>`<option>${a.id}</option>`).join("")||"<option value=''>(add agent first)</option>"}</select></div></div>
 <div id="pv" class="card"></div><button onclick="addLoan()">Submit for approval</button><p class="mu">Formula: Total = Principal + Interest + Fees; EMI = Total ÷ Days; the last instalment absorbs rounding.</p></div>`}
function prev(){const P=+$("#P").value,i=+$("#I").value,f=+$("#F").value,d=+$("#D").value;if(!P||!d)return;const c=calc(P,i,f,d);$("#pv").innerHTML=`Interest ${R(c.interest)} · Total ${R(c.total)} · EMI ${R(c.emi)} × ${d-1} + last ${R(c.last)}`}
function addLoan(){const P=+$("#P").value,i=+$("#I").value,f=+$("#F").value,d=+$("#D").value;if(!P||d<1||!$("#S").value)return alert("Check inputs");const c=calc(P,i,f,d),id="SGF-L"+String(++DB.seq.l).padStart(4,"0");
 DB.loans.push({id,cust:arg,principal:P,rate:i,fee:f,days:d,interest:c.interest,total:c.total,emi:c.emi,last:c.last,start:$("#S").value,last_d:addD($("#S").value,d-1),agent:$("#A").value,status:"pending",applied:today()});log("Loan "+id+" created (pending)");go("file",arg)}
function approve(id){const l=DB.loans.find(x=>x.id==id);l.status="active";l.approved=today();log("Loan "+id+" approved; terms locked");render()}
function pay(id){const l=DB.loans.find(x=>x.id==id),a=+$("#a"+id).value;if(!(a>0)||!can(l))return alert("Enter valid amount");const st=stats(l);if(a>st.rem+.005)return alert("Amount exceeds balance "+R(st.rem));
 const n=++DB.seq.p;DB.pay.push({id:n,rc:"RC"+String(n).padStart(6,"0"),loan:id,amt:a,mode:$("#m"+id).value,date:today(),by:S.id,rev:false});log("Payment RC"+n+" "+R(a)+" on "+id);receipt(n)}
function rev(n){const p=DB.pay.find(x=>x.id==n);const r=prompt("Reason for reversal (original stays in audit):");if(!r)return;p.rev=true;p.why=r;log("Payment "+p.rc+" reversed: "+r);render()}
function receipt(n){const p=DB.pay.find(x=>x.id==n),l=DB.loans.find(x=>x.id==p.loan),c=DB.cust.find(x=>x.id==l.cust),s=stats(l);
 const w=window.open("","_blank");if(!w){alert("Payment saved ✔ (receipt window was blocked; print it later from the customer file)");render();return}
 w.document.write(`<body style="font-family:sans-serif;max-width:380px;margin:20px auto"><h2 style="color:#0b2a5b;margin:0">SHREE GANPATI FINANCE</h2><small>Founder & CEO: ${CO.f} · ${CO.p}</small><hr><b>Receipt ${p.rc}</b><br>Date: ${dm(p.date)}<br>Customer: ${esc(c.name)} (${c.id})<br>Loan: ${l.id}<br>Amount: <b>${R(p.amt)}</b> (${p.mode})<br>Remaining balance: ${R(s.rem)}<br>Collected by: ${p.by}<hr><small>${CO.t}</small><br><button onclick="print()">Print / PDF</button></body>`);w.document.close();render()}
function coll(){const td=today(),rows=loans().map(l=>({l,c:DB.cust.find(x=>x.id==l.cust),s:sched(l).find(x=>x.due==td)})).filter(r=>r.s);
 const exp=rows.reduce((x,r)=>x+r.s.amt,0),got=rows.reduce((x,r)=>x+r.s.paid,0);
 return`<h2>${t("coll")} · ${dm(td)}</h2><div class="grid"><div class="st"><span>Customers</span><b>${rows.length}</b></div><div class="st"><span>Expected</span><b>${R(exp)}</b></div><div class="st"><span>Collected</span><b>${R(got)}</b></div></div><div class="card tw" style="margin-top:12px"><table>${rows.map(r=>`<tr><td onclick="go('file','${r.c.id}')" style="cursor:pointer;color:var(--navy);font-weight:600">${esc(r.c.name)}</td><td>${R(r.s.amt)}</td><td>${pill(r.s.st)}</td><td><input id="a${r.l.id}" type="number" inputmode="decimal" value="${r.s.amt}" style="width:80px;margin:0"></td><td><select id="m${r.l.id}" style="width:78px;margin:0"><option>Cash</option><option>UPI</option><option>Bank Transfer</option></select></td><td><button onclick="pay('${r.l.id}')">Add</button> <button class="s" onclick="miss('${r.l.id}')">✘</button></td></tr>`).join("")||"<tr><td>No instalments due today</td></tr>"}</table></div>`}
function over(){const rows=loans().map(l=>({l,c:DB.cust.find(x=>x.id==l.cust),s:stats(l)})).filter(r=>r.s.overdue>0);
 return`<h2>${t("over")}</h2><div class="card tw"><table><tr><th>Customer</th><th>Mobile</th><th>Missed</th><th>Overdue</th><th>Balance</th></tr>${rows.map(r=>`<tr onclick="go('file','${r.c.id}')" style="cursor:pointer"><td>${esc(r.c.name)}</td><td>${esc(r.c.mob)}</td><td>${r.s.missed}</td><td style="color:var(--o)">${R(r.s.overdue)}</td><td>${R(r.s.rem)}</td></tr>`).join("")||"<tr><td>No overdue customers</td></tr>"}</table></div><p class="mu">Penalties are not auto-charged in this build; EMI overdue is shown separately.</p>`}
function agents(){return`<h2>${t("agents")}</h2><div class="card"><div class="row"><input id="ai" placeholder="Agent ID"><input id="ap" type="password" placeholder="Password (8+)"><button onclick="addAgent()">Add agent</button></div></div><div class="card tw"><table>${DB.users.map(u=>`<tr><td>${esc(u.id)}</td><td>${u.role}</td><td>${u.on?"active":"inactive"}</td><td>${u.role=="agent"?`<button class="s" onclick="tog('${u.id}')">${u.on?"Deactivate":"Activate"}</button>`:""}</td></tr>`).join("")}</table></div>`}
async function addAgent(){const i=$("#ai").value.trim(),p=$("#ap").value;if(!i||p.length<8||DB.users.some(u=>u.id==i))return alert("Invalid or duplicate");if(!RAW)return alert("Login with password (not fingerprint) to add agents");const salt=crypto.getRandomValues(new Uint8Array(16)),pk=await kdf(p,salt);DB.users.push({id:i,name:i,role:"agent",on:true,salt:b64(salt),wk:await aes(pk,b64(RAW))});log("Agent "+i+" added");render()}
function tog(i){const u=DB.users.find(x=>x.id==i);u.on=!u.on;log("Agent "+i+(u.on?" activated":" deactivated"));render()}
function audit(){return`<h2>${t("audit")}</h2><div class="card tw"><table>${DB.audit.slice(0,100).map(a=>`<tr><td>${a.at}</td><td>${esc(a.u)}</td><td>${esc(a.a)}</td></tr>`).join("")}</table></div>`}
const ph0="data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><rect width="40" height="40" fill="#dbe3ef"/><circle cx="20" cy="15" r="7" fill="#8a96ab"/><path d="M6 40c2-12 26-12 28 0z" fill="#8a96ab"/></svg>');
function img(f,m){return new Promise(r=>{const im=new Image();im.onload=()=>{const k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);r(c.toDataURL("image/jpeg",.7))};im.src=URL.createObjectURL(f)})}
async function setPhoto(id,f){if(!f)return;DB.cust.find(x=>x.id==id).photo=await img(f,200);log("Photo updated "+id);render()}
async function addDoc(id){const f=$("#df").files[0];if(!f)return alert("Choose a file");let d;if(f.type.startsWith("image/"))d=await img(f,900);else if(f.size<300000)d=await new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(f)});else return alert("PDF must be under 300 KB");const c=DB.cust.find(x=>x.id==id);c.docs=c.docs||[];c.docs.push({t:$("#dt").value,n:f.name,d,at:today()});log("Document added "+id);render()}
function viewDoc(id,i){const o=DB.cust.find(x=>x.id==id).docs[i],w=window.open("","_blank");if(w){w.document.write(o.d.startsWith("data:image")?`<img src="${o.d}" style="max-width:100%">`:`<embed src="${o.d}" width="100%" height="100%">`);w.document.close()}}
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))),unb=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
try{if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}
